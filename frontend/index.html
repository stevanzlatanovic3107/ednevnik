<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eDnevnik - Elektronski sistem evidencije</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    .hero {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .hero-content {
      text-align: center;
      max-width: 800px;
    }
    .hero-logo {
      width: 80px;
      height: 80px;
      background: var(--accent);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .hero-logo i {
      font-size: 40px;
      color: var(--navy);
    }
    .hero h1 {
      font-size: 2.5rem;
      color: white;
      margin-bottom: 16px;
    }
    .hero p {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 40px;
    }
    .hero-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-hero {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--navy);
    }
    .btn-primary:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
    }
    .btn-outline {
      background: transparent;
      border: 2px solid white;
      color: white;
    }
    .btn-outline:hover {
      background: rgba(255,255,255,0.1);
      transform: translateY(-2px);
    }
    .features {
      background: white;
      padding: 60px 40px;
    }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .feature-card {
      text-align: center;
      padding: 30px;
    }
    .feature-card i {
      font-size: 40px;
      color: var(--accent);
      margin-bottom: 16px;
    }
    .feature-card h3 {
      font-size: 1.2rem;
      color: var(--navy);
      margin-bottom: 8px;
    }
    .feature-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-content">
      <div class="hero-logo">
        <i class="ti ti-school"></i>
      </div>
      <h1>eDnevnik</h1>
      <p>Elektronski sistem evidencije za škole</p>
      <div class="hero-buttons">
        <a href="login.html" class="btn-hero btn-primary">
          <i class="ti ti-login"></i> Prijava
        </a>
        <a href="register.html" class="btn-hero btn-outline">
          <i class="ti ti-building"></i> Registrujte školu
        </a>
      </div>
    </div>
  </div>

  <div class="features">
    <div class="features-grid">
      <div class="feature-card">
        <i class="ti ti-clipboard-list"></i>
        <h3>Evidencija ocena</h3>
        <p>Unos i pregled ocena u realnom vremenu</p>
      </div>
      <div class="feature-card">
        <i class="ti ti-user-check"></i>
        <h3>Praćenje prisustva</h3>
        <p>Evidencija izostanaka učenika</p>
      </div>
      <div class="feature-card">
        <i class="ti ti-calendar"></i>
        <h3>Raspored časova</h3>
        <p>Pregled rasporeda po odeljenjima</p>
      </div>
      <div class="feature-card">
        <i class="ti ti-report"></i>
        <h3>Izveštaji</h3>
        <p>Statistike i proseci učenika</p>
      </div>
    </div>
  </div>
</body>
</html>
