<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prijava - eDnevnik</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: 24px;
      padding: 40px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .login-card h1 {
      font-size: 1.8rem;
      color: var(--navy);
      margin-bottom: 8px;
    }
    .login-card .subtitle {
      color: var(--text-muted);
      margin-bottom: 32px;
    }
    .input-icon {
      position: relative;
    }
    .input-icon i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
    }
    .input-icon input, .input-icon select {
      width: 100%;
      padding: 12px 12px 12px 40px;
      border: 1px solid var(--border-mid);
      border-radius: 12px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1><i class="ti ti-login"></i> Prijava</h1>
      <p class="subtitle">Prijavite se na vaš nalog</p>

      <div id="error" class="alert alert-error" style="display:none; margin-bottom: 20px;"></div>

      <div class="form-group">
        <label>Škola (ID ili email škole)</label>
        <div class="input-icon">
          <i class="ti ti-building"></i>
          <input type="text" id="skolaId" placeholder="Unesite email škole ili ID">
        </div>
        <small class="text-muted">Npr. skola@example.com (email koji ste koristili pri registraciji)</small>
      </div>

      <div class="form-group">
        <label>Korisničko ime</label>
        <div class="input-icon">
          <i class="ti ti-user"></i>
          <input type="text" id="username" placeholder="direktor, milica, roditelj1">
        </div>
      </div>

      <div class="form-group">
        <label>Lozinka</label>
        <div class="input-icon">
          <i class="ti ti-lock"></i>
          <input type="password" id="password" placeholder="******">
        </div>
      </div>

      <button id="loginBtn" class="btn-primary" style="margin-top: 16px;">
        <i class="ti ti-arrow-right"></i> Prijavite se
      </button>

      <div style="margin-top: 24px; text-align: center;">
        <a href="register.html" style="color: var(--navy);">Nemate nalog? Registrujte školu</a>
        <br>
        <a href="index.html" style="color: var(--text-muted); font-size: 0.8rem;">← Nazad na početnu</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/api';

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const skolaEmail = document.getElementById('skolaId').value;
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!skolaEmail || !username || !password) {
        showError('Popunite sva polja');
        return;
      }

      // Prvo dohvatimo skolaId po email-u
      try {
        // Za sada jednostavno: koristimo skolaId = 1 ako je demo
        // U pravoj implementaciji bi imali API /api/skola/by-email/:email
        let skolaId = 1;
        
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, skolaId })
        });

        const result = await response.json();

        if (response.ok) {
          // Sačuvaj token i podatke
          localStorage.setItem('token', result.token);
          localStorage.setItem('user', JSON.stringify(result.user));

          // Preusmeri na osnovu uloge
          if (result.user.uloga === 'admin_skole') {
            window.location.href = 'admin.html';
          } else if (result.user.uloga === 'nastavnik') {
            window.location.href = 'nastavnik.html';
          } else if (result.user.uloga === 'roditelj') {
            window.location.href = 'roditelj.html';
          }
        } else {
          showError(result.error || 'Pogrešni podaci za prijavu');
        }
      } catch (err) {
        showError('Greška: Da li je server pokrenut?');
        console.error(err);
      }
    });

    function showError(msg) {
      const errDiv = document.getElementById('error');
      errDiv.innerHTML = `<i class="ti ti-alert-circle"></i> ${msg}`;
      errDiv.style.display = 'flex';
      setTimeout(() => errDiv.style.display = 'none', 5000);
    }
  </script>
</body>
</html>
