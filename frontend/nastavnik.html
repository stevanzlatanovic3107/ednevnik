<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nastavnički panel - eDnevnik</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    .ocena-input {
      width: 70px;
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
    }
    .predmet-card {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      color: white;
      border-radius: var(--radius-lg);
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .predmet-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }
    .predmet-card i {
      font-size: 32px;
      margin-bottom: 10px;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .btn-icon-only {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      padding: 5px;
    }
  </style>
</head>
<body>
  <div class="app-body">
    <div class="sidebar">
      <div class="sidebar-logo">
        <h2><i class="ti ti-chalkboard"></i> eDnevnik</h2>
        <p>Nastavnički panel</p>
      </div>
      <div class="sidebar-nav">
        <div class="nav-item active" data-tab="mojiRazredi">
          <i class="ti ti-school"></i> <span>Moja odeljenja</span>
        </div>
        <div class="nav-item" data-tab="ocene">
          <i class="ti ti-clipboard-list"></i> <span>Unos ocena</span>
        </div>
        <div class="nav-item" data-tab="izostanci">
          <i class="ti ti-calendar-off"></i> <span>Izostanci</span>
        </div>
      </div>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">N</div>
          <div>
            <div id="userName">Nastavnik</div>
            <small id="userRole">Nastavnik</small>
          </div>
        </div>
        <button class="logout-btn" id="logoutBtn">
          <i class="ti ti-logout"></i> Odjava
        </button>
      </div>
    </div>

    <div class="main-content">
      <div class="topbar">
        <h1 id="pageTitle">Moja odeljenja</h1>
      </div>
      <div class="page-content">
        
        <!-- Moja odeljenja i predmeti -->
        <div id="mojiRazrediTab" class="tab-content active">
          <div id="predmetiContainer">
            <div id="predmetiGrid" class="stats-grid"></div>
          </div>
          <div id="uceniciContainer" style="display:none;">
            <div class="card">
              <div class="card-header">
                <h3>Učenici - <span id="trenutniPredmetNaslov"></span></h3>
                <button class="btn-secondary btn-sm" id="nazadNaPredmeteBtn">
                  <i class="ti ti-arrow-left"></i> Nazad na predmete
                </button>
              </div>
              <div class="table-wrap">
                <table class="data-table w-100">
                  <thead>
                    <tr><th>Ime i prezime</th><th>Prosek</th><th>Poslednje ocene</th><th>Akcije</th>
                  </thead>
                  <tbody id="uceniciLista"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <!-- Unos ocena -->
        <div id="oceneTab" class="tab-content">
          <div class="card">
            <div class="card-header">
              <h3>Unos ocena</h3>
            </div>
            <div class="form-row" style="margin-bottom: 20px;">
              <div class="form-group">
                <label>Izaberite odeljenje</label>
                <select id="oceneRazred" class="input-plain">
                  <option value="">Izaberite odeljenje</option>
                </select>
              </div>
              <div class="form-group">
                <label>Izaberite predmet</label>
                <select id="ocenePredmet" class="input-plain">
                  <option value="">Izaberite predmet</option>
                </select>
              </div>
              <div class="form-group">
                <button class="btn-primary" id="ucitajUcenikeBtn" style="margin-top: 24px;">
                  <i class="ti ti-refresh"></i> Učitaj učenike
                </button>
              </div>
            </div>
            <div class="table-wrap">
              <table class="data-table w-100">
                <thead>
                  <tr><th>Učenik</th><th>Prethodne ocene</th><th>Nova ocena</th><th>Datum</th><th>Akcija</th>
                </thead>
                <tbody id="oceneUceniciLista"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Izostanci -->
        <div id="izostanciTab" class="tab-content">
          <div class="card">
            <div class="card-header">
              <h3>Evidencija izostanaka</h3>
            </div>
            <div class="form-row" style="margin-bottom: 20px;">
              <div class="form-group">
                <label>Izaberite odeljenje</label>
                <select id="izostanciRazred" class="input-plain">
                  <option value="">Izaberite odeljenje</option>
                </select>
              </div>
              <div class="form-group">
                <label>Izaberite predmet</label>
                <select id="izostanciPredmet" class="input-plain">
                  <option value="">Izaberite predmet</option>
                </select>
              </div>
              <div class="form-group">
                <button class="btn-primary" id="ucitajIzostankeBtn" style="margin-top: 24px;">
                  <i class="ti ti-refresh"></i> Učitaj izostanke
                </button>
              </div>
            </div>
            
            <div class="form-row" style="margin-bottom: 20px; background: var(--bg-surface2); padding: 15px; border-radius: var(--radius-md);">
              <div class="form-group">
                <label>Učenik</label>
                <select id="noviIzostanakUcenik" class="input-plain"></select>
              </div>
              <div class="form-group">
                <label>Datum</label>
                <input type="date" id="noviIzostanakDatum" class="input-plain">
              </div>
              <div class="form-group">
                <label>Čas (1-8)</label>
                <input type="number" id="noviIzostanakCas" class="input-plain" min="1" max="8" value="1">
              </div>
              <div class="form-group">
                <label>Opravdan</label>
                <select id="noviIzostanakOpravdan" class="input-plain">
                  <option value="0">Ne</option>
                  <option value="1">Da</option>
                </select>
              </div>
              <div class="form-group">
                <button class="btn-primary" id="dodajIzostanakBtn" style="margin-top: 24px;">
                  <i class="ti ti-plus"></i> Dodaj
                </button>
              </div>
            </div>

            <div class="table-wrap">
              <table class="data-table w-100">
                <thead>
                  <tr><th>Učenik</th><th>Datum</th><th>Čas</th><th>Status</th><th>Napomena</th>
                </thead>
                <tbody id="izostanciLista"></tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Modal za dodavanje ocene -->
  <div id="ocenaModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Dodaj ocenu</h3>
        <button class="close-modal-btn" style="background:none;border:none;font-size:24px;cursor:pointer">&times;</button>
      </div>
      <div class="form-group">
        <label>Učenik</label>
        <input type="text" id="modalUcenikIme" class="input-plain" disabled>
      </div>
      <div class="form-group">
        <label>Ocena (1-5)</label>
        <select id="modalOcenaVrednost" class="input-plain">
          <option value="1">1 (nedovoljan)</option>
          <option value="2">2 (dovoljan)</option>
          <option value="3">3 (dobar)</option>
          <option value="4">4 (vrlo dobar)</option>
          <option value="5">5 (odličan)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Datum</label>
        <input type="date" id="modalOcenaDatum" class="input-plain">
      </div>
      <div class="form-group">
        <label>Napomena</label>
        <input type="text" id="modalOcenaNapomena" class="input-plain" placeholder="Usmeno, pismeno...">
      </div>
      <div class="modal-footer">
        <button class="btn-secondary close-modal-btn">Odustani</button>
        <button class="btn-primary" id="saveOcenaModalBtn">Sačuvaj</button>
      </div>
    </div>
  </div>

  <script src="js/nastavnik.js"></script>
</body>
</html>
